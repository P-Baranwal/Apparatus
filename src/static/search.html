<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search | World Cube Association</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-shell="header"></header>
  <main id="main">
    <div class="container">
      <div class="page-head"><h1>Search results</h1></div>
      <form class="filters card" id="search-form" role="search">
        <div class="field grow">
          <label for="q">Search competitions and persons</label>
          <input id="q" name="q" type="search" placeholder="Name, city, venue, WCA ID" />
        </div>
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
      <div id="results"></div>
    </div>
  </main>
  <footer data-shell="footer"></footer>
  <script type="module" src="/js/pages/search.js"></script>
</body>
</html>
