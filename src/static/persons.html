<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Persons | World Cube Association</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-shell="header"></header>
  <main id="main">
    <div class="container">
      <div class="page-head">
        <h1>Persons</h1>
        <p class="muted small" id="result-count"></p>
      </div>
      <form class="filters card" id="filters" role="search">
        <div class="field grow">
          <label for="q">Name</label>
          <input id="q" name="q" type="search" placeholder="Search by name or local name" />
        </div>
        <div class="field">
          <label for="country_id">Country</label>
          <select id="country_id" name="country_id"><option value="">All countries</option></select>
        </div>
        <div class="field">
          <label for="sort">Sort by</label>
          <select id="sort" name="sort">
            <option value="name">Name (A–Z)</option>
            <option value="podiums">Most podiums</option>
            <option value="competitions">Most competitions</option>
          </select>
        </div>
      </form>
      <div id="results"></div>
      <div id="pagination"></div>
    </div>
  </main>
  <footer data-shell="footer"></footer>
  <script type="module" src="/js/pages/persons.js"></script>
</body>
</html>
