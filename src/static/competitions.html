<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Competitions | World Cube Association</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-shell="header"></header>
  <main id="main">
    <div class="container">
      <div class="page-head">
        <h1>Competitions</h1>
        <p class="muted small" id="result-count"></p>
      </div>

      <form class="filters card" id="filters" role="search">
        <div class="field grow">
          <label for="q">Search</label>
          <input id="q" name="q" type="search" placeholder="Name, city or venue" />
        </div>
        <div class="field">
          <label for="country_id">Country</label>
          <select id="country_id" name="country_id"><option value="">All countries</option></select>
        </div>
        <div class="field">
          <label for="continent_id">Region</label>
          <select id="continent_id" name="continent_id"><option value="">All regions</option></select>
        </div>
        <div class="field">
          <label for="event_id">Event</label>
          <select id="event_id" name="event_id"><option value="">All events</option></select>
        </div>
        <div class="field">
          <label for="year">Year</label>
          <input id="year" name="year" type="number" min="2003" max="2100" inputmode="numeric" placeholder="Any" />
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="">Any</option>
            <option value="upcoming">Upcoming</option>
            <option value="in_progress">In progress</option>
            <option value="past">Past</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">Sort by</label>
          <select id="sort" name="sort">
            <option value="date_desc">Newest first</option>
            <option value="date_asc">Oldest first</option>
            <option value="name">Name</option>
            <option value="competitors">Most competitors</option>
          </select>
        </div>
        <button class="btn" type="reset" id="clear">Clear</button>
      </form>

      <div id="results"></div>
      <div id="pagination"></div>
    </div>
  </main>
  <footer data-shell="footer"></footer>
  <script type="module" src="/js/pages/competitions.js"></script>
</body>
</html>
